name: Disease cohort validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/neuro_twin/disease/**"
      - "backend/tests/test_disease_cohorts.py"
      - ".github/workflows/disease-cohort-validation.yml"
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  disease-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e './backend'

      - name: Run unit tests
        run: python -m pytest -q backend/tests/test_disease_cohorts.py

      - name: Fetch real public disease cohorts
        run: |
          cd backend
          python -m neuro_twin.disease.report --output runtime/disease_cohort_evidence.json

      - name: Upload disease evidence
        uses: actions/upload-artifact@v4
        with:
          name: neuro-twin-disease-cohort-${{ github.run_id }}
          path: backend/runtime/disease_cohort_evidence.json
          retention-days: 30
