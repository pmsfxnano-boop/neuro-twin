[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-twin"
version = "0.1.3"
description = "Source-independent neurodegenerative disease digital-twin research engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
science = [
  "jax>=0.4.30,<1",
  "diffrax>=0.6,<1",
  "numpyro>=0.15,<1",
  "polars>=1.0,<2",
  "pyarrow>=17,<20",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
